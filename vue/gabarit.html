<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Équipement outdoor</title>
<style>
:root {
  --fond: #f6f5f1; --carte: #ffffff; --texte: #1d1f1c; --doux: #6a6d66; --ligne: #e2e0d8;
  --accent: #2f6b4f; --accent-fond: #e3efe8; --manque: #b4462f; --manque-fond: #f8e6e1;
  --prevu: #9a6b12; --prevu-fond: #f6ecd6;
  --chaud: #b5541c; --chaud-fond: #fbe9dc; --froid: #2c5f9e; --froid-fond: #e2ecf8; --neutre-fond: #ecebe5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #161815; --carte: #20231f; --texte: #e8e8e3; --doux: #9a9d94; --ligne: #33372f;
    --accent: #7cc4a0; --accent-fond: #1f3a2d; --manque: #ec8a72; --manque-fond: #3f221b;
    --prevu: #e0b45c; --prevu-fond: #3a2f17;
    --chaud: #f0a070; --chaud-fond: #3e2617; --froid: #8db8ec; --froid-fond: #1b2a3e; --neutre-fond: #2b2e28;
  }
}
:root[data-theme="dark"] {
  --fond: #161815; --carte: #20231f; --texte: #e8e8e3; --doux: #9a9d94; --ligne: #33372f;
  --accent: #7cc4a0; --accent-fond: #1f3a2d; --manque: #ec8a72; --manque-fond: #3f221b;
  --prevu: #e0b45c; --prevu-fond: #3a2f17;
  --chaud: #f0a070; --chaud-fond: #3e2617; --froid: #8db8ec; --froid-fond: #1b2a3e; --neutre-fond: #2b2e28;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 860px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; }
.meta { color: var(--doux); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 2; background: var(--fond); border-bottom: 1px solid var(--ligne); }
nav .in { max-width: 860px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
nav button { border: 0; background: none; color: var(--doux); font: inherit; font-weight: 600;
  padding: 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button.actif { color: var(--texte); border-color: var(--accent); }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
section[hidden] { display: none; }
.outils { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
.btn { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); }
.btn:hover { border-color: var(--accent); }
.btn.principal { background: var(--accent); border-color: var(--accent); color: var(--carte); font-weight: 600; }
.btn.danger { color: var(--manque); border-color: var(--manque-fond); }
.btn.petit { font-size: 12px; padding: 3px 9px; }
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
h2.univers { font-size: 19px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--texte); }
h2.activite { font-size: 21px; margin: 8px 0 4px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 12px 0 4px; }
.ligne { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--ligne); }
.ligne:first-of-type { border-top: 0; }
.ligne .corps { flex: 1; min-width: 0; }
.ligne .droite { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.titre { font-weight: 600; }
.sous { color: var(--doux); font-size: 13px; }
.pastille { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.ok { background: var(--accent-fond); color: var(--accent); }
.manque { background: var(--manque-fond); color: var(--manque); }
.prevu { background: var(--prevu-fond); color: var(--prevu); }
.chaud { background: var(--chaud-fond); color: var(--chaud); }
.froid { background: var(--froid-fond); color: var(--froid); }
.toutes-saisons { background: var(--neutre-fond); color: var(--doux); }
.vide { color: var(--doux); padding: 12px 0; }
.erreur { color: var(--manque); padding: 8px 0; }
/* Mes sorties */
.sortie-lien { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.sortie-lien:hover { border-color: var(--accent); }
.progression { height: 4px; border-radius: 4px; background: var(--neutre-fond); margin-top: 8px; overflow: hidden; }
.progression span { display: block; height: 100%; background: var(--accent); }
.md p { margin: 6px 0; color: var(--doux); font-size: 14px; }
.md .ligne { cursor: pointer; }
.md .ligne input[type=checkbox] { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.md .ligne.coche .titre { text-decoration: line-through; color: var(--doux); }
.md .puce { padding: 4px 0; font-size: 14px; }
/* Édition */
dialog { border: 1px solid var(--ligne); border-radius: 14px; padding: 0; width: min(720px, calc(100vw - 32px));
  max-height: calc(100vh - 32px); background: var(--carte); color: var(--texte); }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
#e-form { padding: 16px 18px; }
#e-form h2 { margin-top: 0; }
.champs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
#e-form label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--doux); }
#e-form label.large { grid-column: 1 / -1; }
#e-form label.case { flex-direction: row; align-items: center; gap: 6px; padding-top: 18px; }
#e-form input:not([type=checkbox]), #e-form select, #e-form textarea { font: inherit; font-size: 14px; color: var(--texte);
  padding: 7px 9px; border: 1px solid var(--ligne); border-radius: 8px; background: var(--fond); width: 100%; }
#e-form fieldset { border: 1px solid var(--ligne); border-radius: 10px; margin: 12px 0; padding: 8px 12px 12px; }
#e-form legend { font-size: 13px; font-weight: 600; padding: 0 4px; }
.cases { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 8px; }
.cases label, .liste-roles label { flex-direction: row !important; align-items: center; gap: 5px !important; color: var(--texte) !important; font-size: 14px !important; }
.liste-roles { max-height: 220px; overflow-y: auto; margin-top: 8px; }
.liste-roles h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 10px 0 4px; }
.liste-roles .cases { margin: 0; }
.actions { margin: 14px 0 0; }
.espace { flex: 1; }
@media print {
  nav, .outils, .btn { display: none !important; }
  body { background: #fff; color: #000; }
  .carte { border-color: #ccc; break-inside: avoid; }
}
</style>
</head>
<body>
<header>
  <h1>Équipement outdoor</h1>
  <div class="meta" id="meta"></div>
</header>
<nav><div class="in">
  <button data-onglet="sorties" class="actif">Mes sorties</button>
  <button data-onglet="manques">À acheter</button>
  <button data-onglet="equipements">Mes équipements</button>
</div></nav>
<main>
  <section id="sorties">
    <div id="s-contenu"></div>
  </section>

  <section id="manques" hidden>
    <div class="outils"><button class="btn principal" id="m-ajouter" hidden>Ajouter un objet</button></div>
    <div id="m-liste"></div>
  </section>

  <section id="equipements" hidden>
    <div class="outils">
      <button class="btn principal" id="i-ajouter" hidden>Ajouter un objet</button>
      <button class="btn" id="i-export">Exporter (.csv)</button>
    </div>
    <div id="i-liste"></div>
  </section>
</main>

<dialog id="editeur">
  <form method="dialog" id="e-form">
    <h2 id="e-titre">Objet</h2>
    <div class="champs">
      <label class="large">Nom<input name="nom" required></label>
      <label>Identifiant<input name="id" pattern="[a-z0-9]+(-[a-z0-9]+)*" title="kebab-case : minuscules, chiffres et tirets"></label>
      <label>Fichier<select name="fichier"></select></label>
      <label>Marque<input name="marque"></label>
      <label>Modèle<input name="modele"></label>
      <label>Catégorie<select name="categorie"></select></label>
      <label>Statut<select name="statut"></select></label>
      <label>Saison<select name="saison"><option value="">—</option></select></label>
      <label>Temp. mini (°C)<input name="temp_min" type="number" step="any"></label>
      <label>Temp. maxi (°C)<input name="temp_max" type="number" step="any"></label>
      <label>Poids (g)<input name="poids_g" type="number" step="any"></label>
      <label class="case"><input name="impermeable" type="checkbox">Imperméable</label>
      <label class="large">Lien<input name="lien" type="url"></label>
    </div>
    <fieldset><legend>Activités</legend><div id="e-activites" class="cases"></div>
      <input name="autres_activites" placeholder="Autres activités, séparées par des virgules"></fieldset>
    <fieldset><legend>Rôles</legend><input type="search" id="e-filtre-roles" placeholder="Filtrer les rôles…">
      <div id="e-roles" class="liste-roles"></div></fieldset>
    <fieldset><legend>Rôles différents selon l'activité (facultatif)</legend>
      <textarea name="roles_par_activite" rows="2" placeholder="gravel: haut-rechange"></textarea>
      <div class="sous">Une ligne par activité : « activité: rôle1, rôle2 ». Ces rôles remplacent les rôles ci-dessus pour cette activité.</div></fieldset>
    <div class="sous" id="e-aide-categorie"></div>
    <label class="large">Notes<textarea name="notes" rows="3"></textarea></label>
    <div class="erreur" id="e-erreurs"></div>
    <div class="outils actions">
      <button type="button" class="btn danger" id="e-supprimer">Supprimer</button>
      <span class="espace"></span>
      <button type="button" class="btn" id="e-annuler">Annuler</button>
      <button type="submit" class="btn principal">Enregistrer</button>
    </div>
  </form>
</dialog>

<script id="donnees" type="application/json">/*DONNEES*/</script>
<script>
let D;
try { D = JSON.parse(document.getElementById("donnees").textContent); }
catch {
  document.querySelector("nav").remove();
  document.querySelector("main").innerHTML = `<p class="vide">Ce fichier est le gabarit, sans données.
    Lance l'application (<code>ruby vue/serveur.rb</code>) ou génère <strong>vue/index.html</strong>.</p>`;
  throw new Error("gabarit ouvert sans données");
}
// Mode édition : page servie par l'application locale (vue/serveur.rb), pas ouverte comme fichier.
const EDITION = location.protocol.startsWith("http") && !!D.fichiers;
let ROLE = Object.fromEntries(D.roles.map(r => [r.id, r]));
let ORDRE = [...new Set(D.roles.map(r => `${r.univers}/${r.groupe}`))];
const UNIVERS_NEUTRE = { "en-action": "En activité", "hors-action": "Hors activité" };
const GROUPES = { haut: "Haut", bas: "Bas", accessoires: "Accessoires", portage: "Portage", reparation: "Réparation et outils",
  "navigation-energie": "Navigation et énergie", ravitaillement: "Ravitaillement", securite: "Sécurité",
  "nuit-refuge": "Nuit en refuge", bivouac: "Bivouac" };
const SAISONS = { chaud: "Chaud", froid: "Froid", "toutes-saisons": "Toutes saisons" };
const STATUTS = { possede: "Possédé", "a-confirmer": "À confirmer", "a-acheter": "À acheter", envisage: "Envisagé", reforme: "Réformé" };
const POSSEDES = ["possede", "a-confirmer"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tag = s => s ? `<span class="tag ${s}">${SAISONS[s] || s}</span>` : "";
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/’/g, "'");
const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const stocker = {
  lire(k, defaut) { try { return JSON.parse(localStorage.getItem(k)) ?? defaut; } catch { return defaut; } },
  ecrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const carte = (g, contenu) => `<div class="carte"><h3>${GROUPES[g] || g}</h3>${contenu}</div>`;
const plage = o => o.temp_min == null && o.temp_max == null ? "" : `${o.temp_min ?? "?"} à ${o.temp_max ?? "?"} °C`;
const aujourdhui = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const majuscule = s => s ? s[0].toUpperCase() + s.slice(1) : s;
function telecharger(nom, contenu, type) {
  const url = URL.createObjectURL(new Blob([contenu], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: nom });
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

// Range des éléments par univers puis par groupe (Haut, Bas…). cle(x) donne le rôle de classement.
function parUnivers(elements, cle, rendu, UNIVERS = UNIVERS_NEUTRE) {
  const paquets = {};
  elements.forEach(x => { const r = ROLE[cle(x)]; if (r) (paquets[`${r.univers}/${r.groupe}`] ||= []).push(x); });
  let html = "", univers = null;
  for (const k of ORDRE.filter(k => paquets[k])) {
    const [u, g] = k.split("/");
    if (u !== univers) { html += `<h2 class="univers">${UNIVERS[u] || u}</h2>`; univers = u; }
    html += rendu(paquets[k], g);
  }
  return html;
}

/* Onglets */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("actif", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== b.dataset.onglet);
  stocker.ecrire("onglet", b.dataset.onglet);
});
(document.querySelector(`nav button[data-onglet="${stocker.lire("onglet", "sorties")}"]`) || document.querySelector("nav button")).click();

/* Mes sorties : les checklists écrites par Claude dans sorties/, cochables */
let sortieOuverte = stocker.lire("sortie-ouverte", null);
const enLigne = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
// Rendu des checklists Markdown : titres, cases à cocher (avec numéro de ligne), puces, paragraphes.
function rendreMarkdown(md) {
  const lignes = md.split("\n"), blocs = [];
  let liste = null;
  const fermer = () => { if (liste) { blocs.push(`<div class="carte">${liste.join("")}</div>`); liste = null; } };
  lignes.forEach((l, i) => {
    const caseM = l.match(/^\s*- \[([ xX])\] (.*)$/), puce = l.match(/^\s*- (.*)$/);
    if (/^# /.test(l)) return;
    if (/^### /.test(l)) { fermer(); blocs.push(`<h3>${enLigne(l.slice(4))}</h3>`); return; }
    if (/^## /.test(l)) { fermer(); blocs.push(`<h2 class="univers">${enLigne(l.slice(3))}</h2>`); return; }
    if (caseM) {
      liste ||= [];
      const coche = caseM[1] !== " ", [nom, ...suite] = caseM[2].split(" – ");
      liste.push(`<label class="ligne${coche ? " coche" : ""}"><input type="checkbox" data-ligne="${i}"${coche ? " checked" : ""}${EDITION ? "" : " disabled"}>
        <span class="corps"><span class="titre">${enLigne(nom)}</span>${suite.length ? `<span class="sous"> – ${enLigne(suite.join(" – "))}</span>` : ""}</span></label>`);
      return;
    }
    if (puce) { liste ||= []; liste.push(`<div class="puce">• ${enLigne(puce[1])}</div>`); return; }
    if (/^\s{2,}\S/.test(l) && liste) {   // suite de la ligne précédente
      liste[liste.length - 1] = liste[liste.length - 1].replace(/(<\/span><\/span><\/label>|<\/div>)$/, ` ${enLigne(l.trim())}$1`);
      return;
    }
    if (!l.trim()) return;
    fermer(); blocs.push(`<p>${enLigne(l)}</p>`);
  });
  fermer();
  return blocs.join("");
}
function progression(s) {
  const cases = s.contenu.match(/^\s*- \[[ xX]\] /gm) || [];
  return { total: cases.length, faites: cases.filter(c => /\[[xX]\]/.test(c)).length };
}
function rendreSorties() {
  const s = D.sorties.find(x => x.fichier === sortieOuverte);
  if (s) {
    const p = progression(s);
    $("#s-contenu").innerHTML = `<div class="outils"><button class="btn" id="s-retour">← Toutes les sorties</button>
        <button class="btn" onclick="print()">Imprimer / PDF</button><span class="sous" id="s-compte">${p.faites} / ${p.total} cochés</span></div>
      <h2 class="activite">${enLigne(s.titre)}</h2><div class="md" data-fichier="${esc(s.fichier)}">${rendreMarkdown(s.contenu)}</div>`;
    $("#s-retour").onclick = () => { sortieOuverte = null; stocker.ecrire("sortie-ouverte", null); rendreSorties(); };
    return;
  }
  $("#s-contenu").innerHTML = D.sorties.length ? D.sorties.map(x => {
    const p = progression(x), d = new Date(x.date + "T12:00");
    return `<button class="sortie-lien" data-ouvrir="${esc(x.fichier)}">
      <div class="titre">${enLigne(x.titre)}</div>
      <div class="sous">${majuscule(x.activite)} · ${d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })} · ${p.faites} / ${p.total} cochés</div>
      <div class="progression"><span style="width:${p.total ? 100 * p.faites / p.total : 0}%"></span></div></button>`;
  }).join("") : `<p class="vide">Aucune sortie pour l'instant. Demande à Claude de préparer ta prochaine sortie
    (par exemple « gravel le we prochain depuis Tours, nuit en gîte ») : sa checklist apparaîtra ici.</p>`;
}
$("#s-contenu").addEventListener("click", e => {
  const b = e.target.closest("[data-ouvrir]");
  if (b) { sortieOuverte = b.dataset.ouvrir; stocker.ecrire("sortie-ouverte", sortieOuverte); rendreSorties(); scrollTo(0, 0); }
});
$("#s-contenu").addEventListener("change", async e => {
  const i = e.target, fichier = i.closest(".md")?.dataset.fichier;
  if (!fichier || !i.dataset.ligne) return;
  i.closest(".ligne").classList.toggle("coche", i.checked);
  const s = D.sorties.find(x => x.fichier === fichier), lignes = s.contenu.split("\n"), n = +i.dataset.ligne;
  lignes[n] = lignes[n].replace(/- \[[ xX]\] /, i.checked ? "- [x] " : "- [ ] ");
  s.contenu = lignes.join("\n");
  const p = progression(s); $("#s-compte").textContent = `${p.faites} / ${p.total} cochés`;
  try {
    const r = await fetch(`/api/sorties/${encodeURIComponent(fichier)}/cocher`, { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ligne: n, coche: i.checked }) });
    if (r.ok) D.version = (await r.json()).version;
  } catch {}
});

/* Rôles et objets */
// Rôles d'un objet pour une activité (roles_par_activite prime sur roles).
function rolesObjet(o, activite) { return (activite && o.roles_par_activite?.[activite]) || o.roles; }
function objetsPour(role, activite) {
  return D.objets.filter(o => rolesObjet(o, activite).includes(role) && o.statut !== "reforme" &&
    (!activite || (o.activites || []).includes(activite)));
}
// Où une activité réclame un rôle : base, mode de température, renfort, modules.
function contextes(a, role) {
  const c = [];
  if (a.base.includes(role)) c.push("toujours");
  for (const mode of ["chaud", "froid"]) {
    const t = a.temperature?.[mode];
    if (!t) continue;
    if ((t.ajouter || []).includes(role)) c.push(mode);
    if ((t.renfort?.ajouter || []).includes(role)) c.push(t.renfort.nom || `${mode} (renfort)`);
  }
  for (const [nom, m] of Object.entries(a.modules || {})) if ((m.ajouter || []).includes(role)) c.push(nom);
  return c;
}
function rolesActivite(a) {
  const t = a.temperature || {};
  return [...new Set([...a.base, ...["chaud", "froid"].flatMap(m => [...(t[m]?.ajouter || []), ...(t[m]?.renfort?.ajouter || [])]),
    ...Object.values(a.modules || {}).flatMap(m => m.ajouter || [])])];
}

/* Manques : uniquement les rôles qu'aucun objet possédé ne remplit, par activité */
function manquesDe(a) {
  return rolesActivite(a).filter(r => !objetsPour(r, a.activite).some(o => POSSEDES.includes(o.statut)));
}
function rendreManques() {
  $("#m-liste").innerHTML = D.activites.map(a => {
    const roles = manquesDe(a);
    const corps = roles.length ? parUnivers(roles, x => x, (liste, g) => carte(g, liste.map(r => {
      const prevus = objetsPour(r, a.activite).filter(o => !POSSEDES.includes(o.statut));
      return `<div class="ligne"><div class="corps"><div class="titre">${esc(ROLE[r].libelle)}</div>
        <div class="sous">${prevus.map(o => `${esc(o.nom)} (${STATUTS[o.statut].toLowerCase()}) · `).join("")}sert : ${esc(contextes(a, r).join(", "))}</div></div>
        <div class="droite"><span class="pastille ${prevus.length ? "prevu" : "manque"}">${prevus.length ? STATUTS[prevus[0].statut] : "Manque"}</span>
        ${!EDITION ? "" : prevus.length ? `<button class="btn petit" data-modifier="${esc(prevus[0].id)}">Modifier</button>`
          : `<button class="btn petit" data-ajouter-role="${r}" data-activite="${esc(a.activite)}">Ajouter</button>`}</div></div>`;
    }).join("")), a.univers) : `<p class="vide">Rien ne manque.</p>`;
    return `<h2 class="activite">${majuscule(a.activite)} <span class="sous">· ${roles.length} manque${roles.length > 1 ? "s" : ""}</span></h2>${corps}`;
  }).join("");
}

/* Mes équipements : ce que je possède, rangé selon le premier rôle de chaque objet */
function mesEquipements() { return D.objets.filter(o => POSSEDES.includes(o.statut)); }
// Rangés par groupe seulement (Haut, Bas, Accessoires…), sans distinction d'univers.
function parGroupe(elements, cle, rendu) {
  const paquets = {}, ordre = [...new Set(D.roles.map(r => r.groupe))];
  elements.forEach(x => { const r = ROLE[cle(x)]; if (r) (paquets[r.groupe] ||= []).push(x); });
  return ordre.filter(g => paquets[g]).map(g => `<h2 class="univers">${GROUPES[g] || g}</h2>${rendu(paquets[g])}`).join("");
}
function rendreEquipements() {
  $("#i-liste").innerHTML = parGroupe(mesEquipements(), o => o.roles[0], liste => `<div class="carte">${liste.map(o => {
    const details = [plage(o), o.poids_g != null ? `${o.poids_g} g` : "", (o.activites || []).join(", "),
      o.roles.map(r => ROLE[r]?.libelle || r).join(", "),
      ...Object.entries(o.roles_par_activite || {}).map(([act, rs]) => `en ${act} : ${rs.map(r => ROLE[r]?.libelle || r).join(", ")}`)].filter(Boolean).join(" · ");
    return `<div class="ligne"><div class="corps"><div class="titre">${o.lien ? `<a href="${esc(o.lien)}" target="_blank" rel="noopener" style="color:inherit">${esc(o.nom)}</a>` : esc(o.nom)}${tag(o.saison)}</div>
      <div class="sous">${esc(details)}</div>${o.notes ? `<div class="sous">${esc(o.notes)}</div>` : ""}</div>
      <div class="droite">${o.statut === "a-confirmer" ? `<span class="pastille prevu">À confirmer</span>` : ""}
        ${EDITION ? `<button class="btn petit" data-modifier="${esc(o.id)}">Modifier</button>` : ""}</div></div>`;
  }).join("")}</div>`) || `<p class="vide">Aucun équipement.</p>`;
}
$("#i-export").onclick = () => {
  const cols = ["id", "nom", "marque", "modele", "univers", "groupe", "saison", "roles", "activites", "temp_min", "temp_max", "impermeable", "poids_g", "statut", "lien", "notes"];
  const val = (o, c) => c === "univers" ? UNIVERS_NEUTRE[ROLE[o.roles[0]]?.univers] : c === "groupe" ? GROUPES[ROLE[o.roles[0]]?.groupe] : o[c];
  const cell = v => { v = Array.isArray(v) ? v.join(" ") : v ?? ""; v = String(v); return /[";\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = [cols.join(";"), ...D.objets.map(o => cols.map(c => cell(val(o, c))).join(";"))].join("\n");
  telecharger(`equipements-${aujourdhui()}.csv`, "﻿" + csv, "text/csv");
};

/* Édition (application locale uniquement) */
function editeurOuvrir(o, modele) {
  const f = $("#e-form"), nouveau = !o;
  o = o || { statut: "possede", roles: [], activites: [], ...modele };
  editeurOuvrir.courant = nouveau ? null : o;
  $("#e-titre").textContent = nouveau ? "Ajouter un objet" : `Modifier : ${o.nom}`;
  $("#e-erreurs").textContent = "";
  $("#e-supprimer").hidden = nouveau;
  f.fichier.innerHTML = D.fichiers.map(x => `<option>${esc(x)}</option>`).join("");
  f.statut.innerHTML = Object.entries(STATUTS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  f.saison.innerHTML = `<option value="">—</option>` + Object.entries(SAISONS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
  for (const k of ["nom", "id", "marque", "modele", "temp_min", "temp_max", "poids_g", "lien", "notes"]) f[k].value = o[k] ?? "";
  f.statut.value = o.statut; f.saison.value = o.saison || ""; f.impermeable.checked = !!o.impermeable;
  f.fichier.value = o.fichier || "vetements";
  f.id.readOnly = !nouveau; f.id.dataset.auto = nouveau ? "1" : "";
  const connues = [...new Set([...D.activites.map(a => a.activite), ...D.objets.flatMap(x => x.activites || [])])];
  $("#e-activites").innerHTML = connues.map(a => `<label><input type="checkbox" value="${esc(a)}"${(o.activites || []).includes(a) ? " checked" : ""}>${esc(a)}</label>`).join("");
  f.autres_activites.value = "";
  let html = "", u = null;
  for (const k of ORDRE) {
    const [uu, g] = k.split("/");
    if (uu !== u) { html += `<h4 style="color:var(--texte)">${UNIVERS_NEUTRE[uu] || uu}</h4>`; u = uu; }
    html += `<h4>${GROUPES[g] || g}</h4><div class="cases">` + D.roles.filter(r => r.univers === uu && r.groupe === g).map(r =>
      `<label data-texte="${esc(norm(r.libelle + " " + r.id))}"><input type="checkbox" value="${r.id}"${o.roles.includes(r.id) ? " checked" : ""}>${esc(r.libelle)}</label>`).join("") + `</div>`;
  }
  $("#e-roles").innerHTML = html; $("#e-filtre-roles").value = "";
  f.roles_par_activite.value = Object.entries(o.roles_par_activite || {}).map(([a, rs]) => `${a}: ${rs.join(", ")}`).join("\n");
  // Nouvel objet avec un rôle déjà choisi : catégorie et fichier proposés d'après ce rôle.
  if (nouveau) $("#e-roles").onchange(); else majCategorie();
  $("#editeur").showModal();
}
// La catégorie est celle du premier rôle coché ; la changer déplace ce rôle (et tous ses objets).
function majCategorie() {
  const f = $("#e-form"), r = ROLE[document.querySelector("#e-roles input:checked")?.value];
  const groupes = [...new Set(D.roles.filter(x => !r || x.univers === r.univers).map(x => x.groupe))];
  f.categorie.innerHTML = groupes.map(g => `<option value="${g}">${GROUPES[g] || g}</option>`).join("");
  f.categorie.disabled = !r;
  if (r) f.categorie.value = r.groupe;
  majAideCategorie();
}
function majAideCategorie() {
  const f = $("#e-form"), r = ROLE[document.querySelector("#e-roles input:checked")?.value];
  const autres = r ? D.objets.filter(o => o.roles.includes(r.id) && o.id !== editeurOuvrir.courant?.id).length : 0;
  $("#e-aide-categorie").textContent = r && f.categorie.value !== r.groupe
    ? `Le rôle « ${r.libelle} » passera dans ${GROUPES[f.categorie.value]}${autres ? `, avec ${autres} autre${autres > 1 ? "s" : ""} objet${autres > 1 ? "s" : ""} qui le remplissent` : ""}.`
    : "";
}
$("#e-form").categorie.onchange = majAideCategorie;
$("#e-form").nom.oninput = e => { const f = $("#e-form"); if (f.id.dataset.auto) f.id.value = slug(e.target.value); };
$("#e-form").id.oninput = e => { e.target.dataset.auto = ""; };
$("#e-filtre-roles").oninput = e => {
  const q = norm(e.target.value);
  document.querySelectorAll("#e-roles label").forEach(l => l.hidden = q && !l.dataset.texte.includes(q));
};
// Fichier proposé d'après le groupe du premier rôle coché, pour un nouvel objet.
$("#e-roles").onchange = () => {
  majCategorie();
  if (editeurOuvrir.courant) return;
  const r = ROLE[document.querySelector("#e-roles input:checked")?.value];
  const parGroupe = { haut: "vetements", bas: "vetements", accessoires: "extremites", "nuit-refuge": "bivouac" };
  const f = r && (parGroupe[r.groupe] || r.groupe);
  if (f && D.fichiers.includes(f)) $("#e-form").fichier.value = f;
};
function editeurLire() {
  const f = $("#e-form"), base = editeurOuvrir.courant ? { ...editeurOuvrir.courant } : {};
  const nombre = v => v === "" ? null : Number(v), texte = v => v.trim() === "" ? null : v.trim();
  const rpa = {};
  f.roles_par_activite.value.split("\n").forEach(l => {
    const [a, rs] = l.split(":"); if (!a?.trim() || !rs) return;
    rpa[a.trim()] = rs.split(",").map(x => x.trim()).filter(Boolean);
  });
  const o = Object.assign(base, {
    id: f.id.value.trim(), nom: f.nom.value.trim(), marque: texte(f.marque.value), modele: texte(f.modele.value),
    roles: [...document.querySelectorAll("#e-roles input:checked")].map(i => i.value),
    roles_par_activite: rpa,
    activites: [...new Set([...document.querySelectorAll("#e-activites input:checked")].map(i => i.value),
      ...f.autres_activites.value.split(",").map(x => slug(x)).filter(Boolean))],
    saison: f.saison.value || null, temp_min: nombre(f.temp_min.value), temp_max: nombre(f.temp_max.value),
    impermeable: f.impermeable.checked, poids_g: nombre(f.poids_g.value), statut: f.statut.value,
    lien: texte(f.lien.value), notes: f.notes.value.trim()
  });
  if (!o.saison) delete o.saison;
  delete o.fichier;
  return { objet: o, fichier: f.fichier.value };
}
async function editeurEnvoyer(methode, url, corps) {
  const r = await fetch(url, { method: methode, headers: { "Content-Type": "application/json" }, body: corps && JSON.stringify(corps) });
  const j = await r.json();
  if (!r.ok) { $("#e-erreurs").innerHTML = (j.erreurs || ["erreur inconnue"]).map(esc).join("<br>"); return false; }
  appliquerDonnees(j); $("#editeur").close(); return true;
}
$("#e-form").onsubmit = async e => {
  e.preventDefault();
  const c = editeurOuvrir.courant, f = $("#e-form");
  const r = ROLE[document.querySelector("#e-roles input:checked")?.value], groupe = f.categorie.value;
  if (r && groupe && groupe !== r.groupe) {
    const rep = await fetch(`/api/roles/${encodeURIComponent(r.id)}`, { method: "PUT",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify({ groupe }) });
    if (!rep.ok) { $("#e-erreurs").innerHTML = ((await rep.json()).erreurs || ["erreur"]).map(esc).join("<br>"); return; }
  }
  editeurEnvoyer(c ? "PUT" : "POST", c ? `/api/objets/${encodeURIComponent(c.id)}` : "/api/objets", editeurLire());
};
$("#e-annuler").onclick = () => $("#editeur").close();
$("#e-supprimer").onclick = () => {
  const c = editeurOuvrir.courant;
  if (c && confirm(`Supprimer définitivement « ${c.nom} » ?\nPour le garder en historique, passe plutôt son statut à « Réformé ».`))
    editeurEnvoyer("DELETE", `/api/objets/${encodeURIComponent(c.id)}`);
};
$("#i-ajouter").onclick = () => editeurOuvrir(null);
$("#m-ajouter").onclick = () => editeurOuvrir(null, { statut: "a-acheter" });
document.querySelector("main").addEventListener("click", e => {
  const d = e.target.dataset || {};
  if (d.modifier) editeurOuvrir(D.objets.find(o => o.id === d.modifier));
  if (d.ajouterRole) editeurOuvrir(null, { statut: "a-acheter", roles: [d.ajouterRole], activites: [d.activite] });
});

// Recharge tout l'affichage avec de nouvelles données (après une édition ou un changement des fichiers).
function appliquerDonnees(d) {
  D = d;
  ROLE = Object.fromEntries(D.roles.map(r => [r.id, r]));
  ORDRE = [...new Set(D.roles.map(r => `${r.univers}/${r.groupe}`))];
  rendreTout();
}
function rendreTout() {
  $("#meta").textContent = `${mesEquipements().length} équipements · ${D.sorties.length} sortie${D.sorties.length > 1 ? "s" : ""} · mis à jour le ${D.genere_le}`;
  rendreSorties(); rendreManques(); rendreEquipements();
}
rendreTout();
if (EDITION) {
  $("#i-ajouter").hidden = false; $("#m-ajouter").hidden = false;
  // Surveille les fichiers : une modification faite ailleurs (par Claude, à la main) s'affiche toute seule.
  setInterval(async () => {
    if ($("#editeur").open) return;
    try {
      const v = (await (await fetch("/api/version")).json()).version;
      if (v !== D.version) appliquerDonnees(await (await fetch("/api/donnees")).json());
    } catch {}
  }, 3000);
}
</script>
</body>
