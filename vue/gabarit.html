<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Équipement outdoor</title>
<style>
:root {
  --fond: #f6f5f1; --carte: #ffffff; --texte: #1d1f1c; --doux: #6a6d66; --ligne: #e2e0d8;
  --accent: #2f6b4f; --accent-fond: #e3efe8; --manque: #b4462f; --manque-fond: #f8e6e1;
  --prevu: #9a6b12; --prevu-fond: #f6ecd6;
  --chaud: #b5541c; --chaud-fond: #fbe9dc; --froid: #2c5f9e; --froid-fond: #e2ecf8; --neutre-fond: #ecebe5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #161815; --carte: #20231f; --texte: #e8e8e3; --doux: #9a9d94; --ligne: #33372f;
    --accent: #7cc4a0; --accent-fond: #1f3a2d; --manque: #ec8a72; --manque-fond: #3f221b;
    --prevu: #e0b45c; --prevu-fond: #3a2f17;
    --chaud: #f0a070; --chaud-fond: #3e2617; --froid: #8db8ec; --froid-fond: #1b2a3e; --neutre-fond: #2b2e28;
  }
}
:root[data-theme="dark"] {
  --fond: #161815; --carte: #20231f; --texte: #e8e8e3; --doux: #9a9d94; --ligne: #33372f;
  --accent: #7cc4a0; --accent-fond: #1f3a2d; --manque: #ec8a72; --manque-fond: #3f221b;
  --prevu: #e0b45c; --prevu-fond: #3a2f17;
  --chaud: #f0a070; --chaud-fond: #3e2617; --froid: #8db8ec; --froid-fond: #1b2a3e; --neutre-fond: #2b2e28;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fond); color: var(--texte);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 16px 8px; max-width: 860px; margin: 0 auto; }
h1 { font-size: 22px; margin: 0 0 2px; }
.meta { color: var(--doux); font-size: 13px; }
nav { position: sticky; top: 0; z-index: 2; background: var(--fond); border-bottom: 1px solid var(--ligne); }
nav .in { max-width: 860px; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; overflow-x: auto; }
nav button { border: 0; background: none; color: var(--doux); font: inherit; font-weight: 600;
  padding: 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
nav button.actif { color: var(--texte); border-color: var(--accent); }
main { max-width: 860px; margin: 0 auto; padding: 16px; }
section[hidden] { display: none; }
.outils { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
select, input[type=search] { font: inherit; padding: 8px 10px; border: 1px solid var(--ligne);
  border-radius: 8px; background: var(--carte); color: var(--texte); min-width: 0; }
input[type=search] { flex: 1 1 180px; }
.btn { font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--ligne); background: var(--carte); color: var(--texte); }
.btn:hover { border-color: var(--accent); }
.carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }
h2 { font-size: 16px; margin: 22px 0 8px; }
h2.univers { font-size: 19px; margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--texte); }
section > div > h2.univers:first-child, #c-liste > h2.univers:first-child { margin-top: 6px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 12px 0 4px; }
.ligne { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--ligne); }
.ligne:first-of-type { border-top: 0; }
.ligne .corps { flex: 1; min-width: 0; }
.titre { font-weight: 600; }
.sous { color: var(--doux); font-size: 13px; }
.pastille { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.ok { background: var(--accent-fond); color: var(--accent); }
.manque { background: var(--manque-fond); color: var(--manque); }
.prevu { background: var(--prevu-fond); color: var(--prevu); }
.chaud { background: var(--chaud-fond); color: var(--chaud); }
.froid { background: var(--froid-fond); color: var(--froid); }
.toutes-saisons { background: var(--neutre-fond); color: var(--doux); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 99px;
  border: 1px solid var(--ligne); background: var(--carte); cursor: pointer; font-size: 14px; }
.chip input { margin: 0; accent-color: var(--accent); }
.chip:has(input:checked) { border-color: var(--accent); background: var(--accent-fond); }
.bascule { display: inline-flex; border: 1px solid var(--ligne); border-radius: 99px; overflow: hidden; margin-right: 4px; }
.bascule label { padding: 6px 14px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--doux); }
.bascule input { position: absolute; opacity: 0; pointer-events: none; }
.bascule label:has(input[value=chaud]:checked) { background: var(--chaud-fond); color: var(--chaud); }
.bascule label:has(input[value=froid]:checked) { background: var(--froid-fond); color: var(--froid); }
.ligne input[type=checkbox] { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex: none; }
.ligne.coche .titre { text-decoration: line-through; color: var(--doux); }
.resume { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.vide { color: var(--doux); padding: 12px 0; }
.saisie { padding: 14px; }
.saisie input[type=text] { font: inherit; width: 100%; padding: 10px 12px; margin: 8px 0 4px; border: 1px solid var(--ligne);
  border-radius: 8px; background: var(--fond); color: var(--texte); }
.saisie .outils { margin: 10px 0 0; }
.saisie .outils input[type=text] { flex: 1 1 160px; width: auto; margin: 0; }
.aide { margin-bottom: 4px; }
.btn.principal { background: var(--accent); border-color: var(--accent); color: var(--carte); font-weight: 600; }
.erreur { color: var(--manque); padding: 8px 0; }
.meteo { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; padding: 12px 0; }
.meteo div { font-size: 13px; color: var(--doux); }
.meteo strong { display: block; font-size: 17px; color: var(--texte); }
.raisons { font-size: 13px; color: var(--doux); padding: 0 0 12px; }
.raisons li { margin: 2px 0; }
@media print {
  nav, .outils, .chips, .btn { display: none !important; }
  body { background: #fff; color: #000; }
  .carte { border-color: #ccc; break-inside: avoid; }
}
</style>
</head>
<body>
<header>
  <h1>Équipement outdoor</h1>
  <div class="meta" id="meta"></div>
</header>
<nav><div class="in">
  <button data-onglet="preparer" class="actif">Préparer</button>
  <button data-onglet="checklist">Checklist</button>
  <button data-onglet="manques">Manques</button>
  <button data-onglet="inventaire">Inventaire</button>
</div></nav>
<main>
  <section id="preparer">
    <div class="carte saisie">
      <label for="p-texte" class="titre">Prépare ta sortie</label>
      <input type="text" id="p-texte" placeholder="Gravel samedi 17 octobre toute la journée" autocomplete="off">
      <div class="sous aide">Activité, jour (demain, samedi, 17 octobre, le we prochain, du 17 au 19…), lieu (à Tours), horaires (8h-14h, départ 7h30, 4h, matin), refuge ou bivouac.</div>
      <div class="outils">
        <input type="text" id="p-ville" placeholder="Ville par défaut" autocomplete="off">
        <label class="btn">Trace GPX<input type="file" id="p-gpx" accept=".gpx" hidden></label>
        <button class="btn principal" id="p-go">Préparer</button>
      </div>
      <div class="sous" id="p-gpx-info"></div>
    </div>
    <div id="p-message"></div>
  </section>

  <section id="checklist" hidden>
    <div class="outils">
      <select id="c-activite"></select>
      <button class="btn" id="c-export">Exporter (.md)</button>
      <button class="btn" id="c-raz">Tout décocher</button>
      <button class="btn" onclick="print()">Imprimer / PDF</button>
    </div>
    <div id="c-sortie"></div>
    <div class="chips" id="c-reglages"></div>
    <div id="c-liste"></div>
  </section>

  <section id="manques" hidden>
    <div class="outils">
      <select id="m-activite"></select>
      <select id="m-perimetre">
        <option value="vetements">Vêtements</option>
        <option value="">Tout l'équipement</option>
      </select>
      <select id="m-saison">
        <option value="">Toutes températures</option>
        <option value="chaud">Chaud</option>
        <option value="froid">Froid</option>
      </select>
      <button class="btn" id="m-export">Exporter (.md)</button>
      <button class="btn" onclick="print()">Imprimer / PDF</button>
    </div>
    <div class="resume" id="m-resume"></div>
    <div id="m-liste"></div>
  </section>

  <section id="inventaire" hidden>
    <div class="outils">
      <input type="search" id="i-recherche" placeholder="Rechercher un objet, une marque…">
      <select id="i-statut"><option value="">Tous statuts</option></select>
      <select id="i-saison"><option value="">Toutes saisons</option></select>
      <button class="btn" id="i-export">Exporter (.csv)</button>
    </div>
    <div id="i-liste"></div>
  </section>
</main>

<script id="donnees" type="application/json">/*DONNEES*/</script>
<script>
let D;
try { D = JSON.parse(document.getElementById("donnees").textContent); }
catch {
  document.querySelector("nav").remove();
  document.querySelector("main").innerHTML = `<p class="vide">Ce fichier est le gabarit, sans données.
    Ouvre <strong>vue/index.html</strong> (ou lance <code>ruby vue/generer.rb</code> pour le créer).</p>`;
  throw new Error("gabarit ouvert à la place de index.html");
}
const ROLE = Object.fromEntries(D.roles.map(r => [r.id, r]));
const UNIVERS_NEUTRE = { "en-action": "En activité", "hors-action": "Hors activité" };
const GROUPES = { haut: "Haut", bas: "Bas", accessoires: "Accessoires", reparation: "Réparation",
  "navigation-energie": "Navigation et énergie", ravitaillement: "Ravitaillement", securite: "Sécurité",
  portage: "Portage", "nuit-refuge": "Nuit en refuge", bivouac: "Bivouac" };
const VETEMENTS = ["haut", "bas", "accessoires"];
const ORDRE = [...new Set(D.roles.map(r => `${r.univers}/${r.groupe}`))];
const SAISONS = { chaud: "Chaud", froid: "Froid", "toutes-saisons": "Toutes saisons" };
const STATUTS = { possede: "Possédé", "a-confirmer": "À confirmer", "a-acheter": "À acheter", envisage: "Envisagé", reforme: "Réformé" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stocker = {
  lire(k, defaut) { try { return JSON.parse(localStorage.getItem(k)) ?? defaut; } catch { return defaut; } },
  ecrire(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const tag = s => s ? `<span class="tag ${s}">${SAISONS[s] || s}</span>` : "";

$("#meta").textContent = `${D.objets.length} objets · généré le ${D.genere_le}`;

// Range des éléments par univers (On bike / Off bike) puis par groupe (Haut, Bas…).
// cle(x) renvoie le rôle qui sert à classer l'élément ; rendu(liste, groupe) produit le HTML d'un groupe.
function parUnivers(elements, cle, rendu, UNIVERS = UNIVERS_NEUTRE) {
  const paquets = {};
  elements.forEach(x => { const r = ROLE[cle(x)]; (paquets[`${r.univers}/${r.groupe}`] ||= []).push(x); });
  let html = "", univers = null;
  for (const k of ORDRE.filter(k => paquets[k])) {
    const [u, g] = k.split("/");
    if (u !== univers) { html += `<h2 class="univers">${UNIVERS[u] || u}</h2>`; univers = u; }
    html += rendu(paquets[k], g);
  }
  return html;
}
function parUniversMd(elements, cle, ligne, UNIVERS = UNIVERS_NEUTRE) {
  const paquets = {};
  elements.forEach(x => { const r = ROLE[cle(x)]; (paquets[`${r.univers}/${r.groupe}`] ||= []).push(x); });
  let md = "", univers = null;
  for (const k of ORDRE.filter(k => paquets[k])) {
    const [u, g] = k.split("/");
    if (u !== univers) { md += `\n## ${UNIVERS[u] || u}\n`; univers = u; }
    md += `\n### ${GROUPES[g] || g}\n\n` + paquets[k].map(ligne).join("");
  }
  return md;
}

/* Réglages de checklist par activité : mode chaud/froid, renfort, modules */
const reglages = stocker.lire("reglages", {});
function reglagesDe(a) { return reglages[a.activite] ||= { mode: "chaud", renfort: false, modules: [] }; }
function rolesDe(a, r) {
  const t = a.temperature?.[r.mode] || {}, renf = r.renfort ? (t.renfort || {}) : {};
  const ajouter = [...a.base, ...(t.ajouter || []), ...(renf.ajouter || [])], retirer = new Set(renf.retirer || []);
  r.modules.forEach(n => { const m = a.modules?.[n]; if (!m) return; ajouter.push(...(m.ajouter || [])); (m.retirer || []).forEach(x => retirer.add(x)); });
  return [...new Set(ajouter)].filter(x => !retirer.has(x));
}
// Saison d'un rôle dans une activité : là où l'activité le réclame.
function saisonRole(a, role) {
  for (const mode of ["chaud", "froid"]) {
    const t = a.temperature?.[mode];
    if (t && [...(t.ajouter || []), ...(t.renfort?.ajouter || [])].includes(role)) return mode;
  }
  return "toutes-saisons";
}

// Sortie préparée (météo, horaires) : sert à choisir l'objet le plus adapté.
let sortie = stocker.lire("sortie", null);
let modeCourant = null;
// Activité affichée : seuls ses objets (champ activites) comptent pour remplir un rôle.
let activiteCourante = null;

// Écart entre un objet et la sortie (0 = colle parfaitement) : plage de température, puis tag saison.
function ecart(o) {
  let e = 0;
  if (modeCourant && o.saison && o.saison !== "toutes-saisons" && o.saison !== modeCourant) e += 5;
  if (sortie && sortie.tmin != null) {
    if (o.temp_min == null && o.temp_max == null) e += 0.5;
    else e += Math.max(0, (o.temp_min ?? -99) - sortie.tmin) + Math.max(0, sortie.tmax - (o.temp_max ?? 99));
  }
  return e;
}
// Rôles d'un objet pour l'activité affichée (roles_par_activite prime sur roles).
function rolesObjet(o) {
  return (activiteCourante && o.roles_par_activite?.[activiteCourante]) || o.roles;
}
// Objets qui remplissent un rôle : possédés d'abord (le plus adapté puis le plus léger),
// les autres comptent comme « prévus ».
function objetsPour(role) {
  const tous = D.objets.filter(o => rolesObjet(o).includes(role) && o.statut !== "reforme" &&
      (!activiteCourante || (o.activites || []).includes(activiteCourante)))
    .sort((a, b) => ecart(a) - ecart(b) || (a.poids_g ?? 9999) - (b.poids_g ?? 9999));
  return { possedes: tous.filter(o => o.statut === "possede"), prevus: tous.filter(o => o.statut !== "possede") };
}
function etat(role) {
  const { possedes, prevus } = objetsPour(role);
  if (possedes.length) return { cls: "ok", txt: possedes.length > 1 ? `${possedes.length} objets` : "OK", possedes, prevus };
  if (prevus.length) return { cls: "prevu", txt: STATUTS[prevus[0].statut], possedes, prevus };
  return { cls: "manque", txt: "Manque", possedes, prevus };
}
function plage(o) {
  if (o.temp_min == null && o.temp_max == null) return "";
  return `${o.temp_min ?? "?"} à ${o.temp_max ?? "?"} °C`;
}
function ligneRole(role, { caseACocher = false, coche = false, note = "", saison = "" } = {}) {
  const r = ROLE[role], e = etat(role);
  const noms = (e.possedes.length ? e.possedes : e.prevus).map(o => [o.nom, plage(o)].filter(Boolean).join(" · "));
  if (note) noms.push(note);
  return `<div class="ligne${coche ? " coche" : ""}">
    ${caseACocher ? `<input type="checkbox" data-role="${role}"${coche ? " checked" : ""} aria-label="${esc(r.libelle)}">` : ""}
    <div class="corps"><div class="titre">${esc(r.libelle)}${tag(saison)}</div>
      <div class="sous">${noms.length ? esc(noms.join(" / ")) : "Aucun objet dans l'inventaire"}</div></div>
    <span class="pastille ${e.cls}">${esc(e.txt)}</span></div>`;
}
function remplirActivites(sel) {
  sel.innerHTML = D.activites.map((a, i) => `<option value="${i}">${esc(a.activite)}</option>`).join("");
}
function telecharger(nom, contenu, type) {
  const url = URL.createObjectURL(new Blob([contenu], { type }));
  const a = Object.assign(document.createElement("a"), { href: url, download: nom });
  document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const aujourdhui = () => isoLocal(new Date());
const carte = (g, contenu) => `<div class="carte"><h3>${GROUPES[g] || g}</h3>${contenu}</div>`;

/* Onglets */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("actif", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== b.dataset.onglet);
  stocker.ecrire("onglet", b.dataset.onglet);
});
const ongletInitial = stocker.lire("onglet", "preparer");
(document.querySelector(`nav button[data-onglet="${ongletInitial}"]`) || document.querySelector("nav button")).click();

/* Checklist */
remplirActivites($("#c-activite"));
const cochees = stocker.lire("cochees", {});
function activiteChecklist() { return D.activites[$("#c-activite").value]; }
// Un même objet qui remplit deux rôles n'est emporté qu'une fois : on le signale.
function notesDoublons(roles) {
  const vu = {}, notes = {};
  for (const r of roles) {
    const o = etat(r).possedes[0];
    if (!o) continue;
    if (vu[o.id]) notes[r] = `même objet que « ${ROLE[vu[o.id]].libelle} »`;
    else vu[o.id] = r;
  }
  return notes;
}
function rendreChecklist() {
  const a = activiteChecklist(), r = reglagesDe(a);
  modeCourant = a.temperature ? r.mode : null; activiteCourante = a.activite;
  const renfort = a.temperature?.[r.mode]?.renfort;
  $("#c-reglages").innerHTML = (a.temperature ? `<span class="bascule">
      <label><input type="radio" name="mode" value="chaud"${r.mode === "chaud" ? " checked" : ""}>Chaud</label>
      <label><input type="radio" name="mode" value="froid"${r.mode === "froid" ? " checked" : ""}>Froid</label></span>
      ${renfort ? `<label class="chip" title="${esc(renfort.condition)}"><input type="checkbox" data-renfort${r.renfort ? " checked" : ""}>${esc(renfort.nom || "renfort")}</label>` : ""}` : "")
    + Object.entries(a.modules || {}).map(([n, m]) =>
      `<label class="chip" title="${esc(m.condition)}"><input type="checkbox" value="${n}"${r.modules.includes(n) ? " checked" : ""}>${esc(n)}</label>`).join("");
  const roles = rolesDe(a, r), deja = cochees[a.activite] || [], notes = notesDoublons(roles);
  $("#c-sortie").innerHTML = sortie && sortie.activite === a.activite ? carteSortie(sortie) : "";
  $("#c-liste").innerHTML = parUnivers(roles, x => x, (liste, g) => carte(g, liste.map(role =>
    ligneRole(role, { caseACocher: true, coche: deja.includes(role), note: notes[role],
      saison: VETEMENTS.includes(g) ? etat(role).possedes[0]?.saison : "" })).join("")), a.univers) || `<p class="vide">Aucun rôle.</p>`;
  modeCourant = activiteCourante = null;
}
$("#c-activite").onchange = rendreChecklist;
$("#c-reglages").onchange = e => {
  const a = activiteChecklist(), r = reglagesDe(a), i = e.target;
  if (i.name === "mode") { r.mode = i.value; r.renfort = false; }
  else if (i.hasAttribute("data-renfort")) r.renfort = i.checked;
  else r.modules = [...document.querySelectorAll("#c-reglages input[value]:not([name]):checked")].map(x => x.value);
  stocker.ecrire("reglages", reglages); rendreChecklist();
};
$("#c-liste").onchange = e => {
  const a = activiteChecklist().activite, r = e.target.dataset.role, liste = new Set(cochees[a] || []);
  e.target.checked ? liste.add(r) : liste.delete(r);
  cochees[a] = [...liste]; stocker.ecrire("cochees", cochees);
  e.target.closest(".ligne").classList.toggle("coche", e.target.checked);
};
$("#c-raz").onclick = () => { cochees[activiteChecklist().activite] = []; stocker.ecrire("cochees", cochees); rendreChecklist(); };
$("#c-export").onclick = () => {
  const a = activiteChecklist(), r = reglagesDe(a);
  modeCourant = a.temperature ? r.mode : null; activiteCourante = a.activite;
  const s = sortie && sortie.activite === a.activite ? sortie : null, roles = rolesDe(a, r), notes = notesDoublons(roles);
  const renfort = r.renfort ? a.temperature?.[r.mode]?.renfort?.nom : null;

  modeCourant = activiteCourante = null;
  telecharger(`${s ? s.date : aujourdhui()}-${a.activite}.md`, md, "text/markdown");
};

/* Préparer une sortie : texte libre + ville ou trace GPX → météo → réglages → checklist */
const MOIS = ["janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre"];
const JOURS = ["dimanche", "lundi", "mardi", "mercredi", "jeudi", "vendredi", "samedi"];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/’/g, "'");
const heure = (h, m) => +h + (m ? +m / 60 : 0);
const fmtH = h => `${Math.floor(h)}h${String(Math.round((h % 1) * 60)).padStart(2, "0")}`;
let trace = null;

function analyserTexte(texte) {
  const t = norm(texte), hyp = [];
  let activite = D.activites.find(a => t.includes(norm(a.activite)));
  if (!activite) { activite = D.activites[0]; hyp.push(`activité non précisée : ${activite.activite}`); }

  const auj = new Date(); auj.setHours(0, 0, 0, 0);
  const dansJours = n => { const d = new Date(auj); d.setDate(d.getDate() + n); return d; };
  let date = null, jours = 1, m;
  const mois = MOIS.join("|");
  if ((m = t.match(new RegExp(`du\\s+(\\d{1,2})(?:er)?(?:\\s+(${mois}))?\\s+au\\s+(\\d{1,2})(?:er)?\\s+(${mois})`)))) {
    const finMois = MOIS.indexOf(m[4]), debutMois = m[2] ? MOIS.indexOf(m[2]) : finMois;
    date = new Date(auj.getFullYear(), debutMois, +m[1]);
    if (date < auj) date.setFullYear(date.getFullYear() + 1);
    const fin = new Date(date.getFullYear() + (finMois < debutMois ? 1 : 0), finMois, +m[3]);
    jours = Math.round((fin - date) / 864e5) + 1;
  } else if (/\b(?:week-?end|we|w-e)\b/.test(t)) {
    // Le samedi qui vient (aujourd'hui si on est samedi) ; le dimanche, « ce week-end » = aujourd'hui.
    if (auj.getDay() === 0 && !/prochain/.test(t)) { date = auj; jours = 1; }
    else { date = dansJours((6 - auj.getDay() + 7) % 7 || (auj.getDay() === 6 && /prochain/.test(t) ? 7 : 0)); jours = 2; }
  } else if ((m = t.match(new RegExp(`(\\d{1,2})(?:er)?\\s+(${mois})`)))) {
    date = new Date(auj.getFullYear(), MOIS.indexOf(m[2]), +m[1]);
    if (date < auj) date.setFullYear(date.getFullYear() + 1);
  } else if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})\b/))) {
    date = new Date(auj.getFullYear(), +m[2] - 1, +m[1]);
    if (date < auj) date.setFullYear(date.getFullYear() + 1);
  } else if (/apres[- ]demain/.test(t)) date = dansJours(2);
  else if (/demain/.test(t)) date = dansJours(1);
  else if (/aujourd/.test(t)) date = auj;
  else {
    const j = JOURS.findIndex(j => new RegExp(`\\b${j}\\b`).test(t));
    if (j >= 0) date = dansJours((j - auj.getDay() + 7) % 7);
  }
  if (!date) { date = auj; hyp.push("date non précisée : aujourd'hui"); }
  if (jours === 1 && (m = t.match(/(\d{1,2})\s*jours/))) jours = +m[1];
  const hebergement = /refuge/.test(t) ? "refuge" : /bivouac/.test(t) ? "bivouac" : null;
  if (jours > 1 && !hebergement) hyp.push("hébergement non précisé : ni refuge ni bivouac");

  let debut = null, fin = null, duree = null;
  if ((m = t.match(/(\d{1,2})\s*h\s*(\d{2})?\s*(?:-|a|jusqu'a)\s*(\d{1,2})\s*h\s*(\d{2})?/))) {
    debut = heure(m[1], m[2]); fin = heure(m[3], m[4]);
  } else {
    if ((m = t.match(/(?:depart|a|des|vers)\s+(\d{1,2})\s*h\s*(\d{2})?/))) debut = heure(m[1], m[2]);
    const reste = m ? t.replace(m[0], "") : t;
    if ((m = reste.match(/(\d{1,2})\s*(?:h|heures?)\s*(\d{2})?/))) duree = heure(m[1], m[2]);
  }
  if (fin == null && duree == null) {
    if (/journee/.test(t)) { debut ??= 9; duree = 8; }
    else if (/apres[- ]midi/.test(t)) { debut ??= 13.5; duree = 4; }
    else if (/matin/.test(t)) { debut ??= 8; duree = 4; }
    else if (/soir/.test(t)) { debut ??= 18; duree = 3; }
  }
  if (fin == null && duree == null && trace) {
    const est = dureeEstimee(activite, trace);
    if (est) { duree = est.h; hyp.push(`durée estimée d'après la trace : ${fmtH(duree)} (${est.methode})`); }
  }
  if (fin == null && duree == null && jours > 1) { debut ??= 9; duree = 8; hyp.push("horaires non précisés : 9h – 17h chaque jour"); }
  if (fin == null && duree == null) { duree = 3; hyp.push("durée non précisée : 3 h"); }
  if (debut == null) { debut = 9; hyp.push("heure de départ non précisée : 9h"); }
  fin ??= debut + duree;
  return { activite, date, jours, hebergement, debut, fin, lieu: lieuDuTexte(t), hypotheses: hyp };
}

// Lieu écrit dans la phrase : « à Tours », « depuis Le Mans », « au départ d'Annecy ».
const PAS_UN_LIEU = new Set(["partir", "journee", "midi", "pied", "velo", "jeun", "fond", "la", "le", "les", ...JOURS, ...MOIS]);
function lieuDuTexte(t) {
  // Noms composés : traits d'union (Saint-Cyr-sur-Loire) ou « sur / sous » avec espaces.
  const re = /(?:^|\s)(?:(?:a|depuis|vers)\s+|au depart d(?:e\s+|'))((?:le |la |les )?[a-z][a-z'-]*(?: (?:sur|sous) [a-z][a-z'-]*)?)/g;
  for (const m of t.matchAll(re)) {
    const mot = m[1].trim();
    if (!PAS_UN_LIEU.has(mot.split(/[ -]/).pop()) && !PAS_UN_LIEU.has(mot) && !/^\d/.test(mot)) return mot;
  }
  return null;
}

function lireGpx(xml) {
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const pts = [...doc.querySelectorAll("trkpt, rtept")].map(p => ({
    lat: +p.getAttribute("lat"), lon: +p.getAttribute("lon"), ele: parseFloat(p.querySelector("ele")?.textContent) }));
  if (pts.length < 2) throw new Error("trace GPX vide ou illisible");
  const rad = x => x * Math.PI / 180;
  let km = 0, dplus = 0, eleRef = pts[0].ele;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lon - a.lon) / 2) ** 2;
    km += 12742 * Math.asin(Math.sqrt(h));
    // Seuil de 5 m pour ne pas compter le bruit de l'altimètre.
    if (!isNaN(b.ele) && !isNaN(eleRef)) {
      if (b.ele - eleRef > 5) { dplus += b.ele - eleRef; eleRef = b.ele; }
      else if (b.ele < eleRef) eleRef = b.ele;
    }
  }
  const eles = pts.map(p => p.ele).filter(e => !isNaN(e));
  return { nom: doc.querySelector("trk > name, rte > name, metadata > name")?.textContent?.trim() || "",
    lat: pts[0].lat, lon: pts[0].lon, km, dplus,
    altMax: eles.length ? Math.max(...eles) : null, altMin: eles.length ? Math.min(...eles) : null };
}
// Durée estimée selon la méthode de l'activité (parametres.vitesse), arrondie au quart d'heure.
function dureeEstimee(activite, t) {
  const v = activite.parametres?.vitesse, q = h => Math.round(h * 4) / 4;
  if (v?.methode === "velo" && v.plat_kmh && v.montee_m_h)
    return { h: q(t.km / v.plat_kmh + t.dplus / v.montee_m_h), methode: `${v.plat_kmh} km/h et 1 h par ${v.montee_m_h} m de D+` };
  if (v?.methode === "km-effort" && v.km_effort_h)
    return { h: q((t.km + t.dplus / 100) / v.km_effort_h), methode: `${v.km_effort_h} km-effort/h` };
  return null;
}

async function geocoder(ville) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&name=${encodeURIComponent(ville)}`);
  const j = await r.json();
  if (!j.results?.length) throw new Error(`ville introuvable : ${ville}`);
  return { lat: j.results[0].latitude, lon: j.results[0].longitude, nom: j.results[0].name };
}

// Météo sur le créneau horaire de chaque jour de la sortie, résumée sur l'ensemble des jours.
async function meteo(lieu, date, jours, debut, fin) {
  const jour = isoLocal(date), dernier = new Date(date); dernier.setDate(dernier.getDate() + jours - 1);
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lieu.lat}&longitude=${lieu.lon}&timezone=auto` +
    `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m` +
    `&daily=sunrise,sunset&start_date=${jour}&end_date=${isoLocal(dernier)}`;
  const r = await fetch(url), j = await r.json();
  if (j.error) throw new Error(/range/.test(j.reason) ? "date hors des prévisions (16 jours maximum)" : j.reason);
  const H = j.hourly, idx = H.time.map((t, i) => [+t.slice(11, 13), i])
    .filter(([h]) => h >= Math.floor(debut) && h <= Math.min(23, Math.ceil(fin))).map(([, i]) => i);
  const val = k => idx.map(i => H[k][i]).filter(v => v != null);
  const hDec = s => heure(s.slice(11, 13), s.slice(14, 16));
  return { tminRessentie: Math.min(...val("apparent_temperature")), tmax: Math.max(...val("temperature_2m")),
    pluieProba: Math.max(0, ...val("precipitation_probability")), pluieMm: val("precipitation").reduce((a, b) => a + b, 0),
    vent: Math.max(...val("wind_speed_10m")), rafales: Math.max(...val("wind_gusts_10m")),
    lever: Math.max(...j.daily.sunrise.map(hDec)), coucher: Math.min(...j.daily.sunset.map(hDec)), altitudeMeteo: j.elevation };
}

// Évalue une condition du type « 12 < temp_min <= 18 » ou « temp_min <= 5 ».
function conditionTemperature(cond, t) {
  const ops = { "<": (a, b) => a < b, "<=": (a, b) => a <= b, ">": (a, b) => a > b, ">=": (a, b) => a >= b };
  let m = cond.match(/^\s*(-?[\d.]+)\s*(<=?)\s*temp_min\s*(<=?)\s*(-?[\d.]+)\s*$/);
  if (m) return ops[m[2]](+m[1], t) && ops[m[3]](t, +m[4]);
  m = cond.match(/^\s*temp_min\s*(<=?|>=?)\s*(-?[\d.]+)\s*$/);
  return m ? ops[m[1]](t, +m[2]) : null;
}

function choisirReglages(activite, s) {
  const r = { mode: "chaud", renfort: false, modules: [] }, raisons = [];
  if (activite.temperature) {
    const seuil = activite.temperature.seuil;
    r.mode = s.tmin > seuil ? "chaud" : "froid";
    raisons.push(`${r.mode} : ressenti le plus bas ${Math.round(s.tmin)} °C (seuil ${seuil} °C)`);
    const renf = activite.temperature[r.mode]?.renfort;
    if (renf && conditionTemperature(renf.condition, s.tmin)) {
      r.renfort = true; raisons.push(`${renf.nom || "renfort"} : ${renf.condition.replace("temp_min", "ressenti mini")}`);
    }
  }
  const P = activite.parametres || {}, proba = P.pluie_proba_min ?? 40, mm = P.pluie_mm_min ?? 1;
  // Chaque module dit quand il s'active (declencheur) ; un seul critère rempli suffit.
  const tests = {
    pluie: () => (s.pluieProba >= proba || s.pluieMm >= mm) && `risque ${s.pluieProba} %, ${s.pluieMm.toFixed(1)} mm prévus`,
    nuit: () => (s.debut < s.lever || s.fin > s.coucher - 0.5) && `soleil ${fmtH(s.lever)} – ${fmtH(s.coucher)}, sortie ${fmtH(s.debut)} – ${fmtH(s.fin)}`,
    duree_h: x => s.fin - s.debut > x && `${fmtH(s.fin - s.debut)} prévues`,
    altitude_m: x => s.trace?.altMax > x && `point haut à ${Math.round(s.trace.altMax)} m`,
    denivele_m: x => s.trace?.dplus > x && `${Math.round(s.trace.dplus)} m de D+`,
    jours: x => (s.jours || 1) >= x && `${s.jours} jours`,
    hebergement: x => s.hebergement === x && `nuit en ${x}`
  };
  for (const [nom, mod] of Object.entries(activite.modules || {})) {
    const raison = Object.entries(mod.declencheur || {}).map(([k, x]) => tests[k]?.(x)).find(Boolean);
    if (raison) { r.modules.push(nom); raisons.push(`${nom} : ${raison}`); }
  }
  return { r, raisons };
}

function carteSortie(s) {
  const alerte = s.rafales >= 40 ? `<li>Rafales à ${Math.round(s.rafales)} km/h : prévoir le coupe-vent même s'il fait doux.</li>` : "";
  return `<div class="carte"><h2 style="margin-top:12px">${esc(s.titre)}</h2>
    <div class="meteo">
      <div>Ressenti mini<strong>${Math.round(s.tmin)} °C</strong></div>
      <div>Maxi<strong>${Math.round(s.tmax)} °C</strong></div>
      <div>Pluie<strong>${s.pluieProba} % · ${s.pluieMm.toFixed(1)} mm</strong></div>
      <div>Vent<strong>${Math.round(s.vent)} km/h</strong>rafales ${Math.round(s.rafales)}</div>
      <div>Soleil<strong>${fmtH(s.lever)} – ${fmtH(s.coucher)}</strong></div>
      ${s.trace ? `<div>Trace<strong>${Math.round(s.trace.km)} km · ${Math.round(s.trace.dplus)} m D+</strong>${s.trace.altMax != null ? `alt. max ${Math.round(s.trace.altMax)} m` : ""}</div>` : ""}
    </div>
    <ul class="raisons">${s.raisons.map(r => `<li>${esc(r)}</li>`).join("")}${alerte}
      ${s.hypotheses.map(h => `<li>Hypothèse : ${esc(h)}</li>`).join("")}</ul></div>`;
}

$("#p-ville").value = stocker.lire("ville", "");
$("#p-gpx").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    trace = lireGpx(await f.text());
    $("#p-gpx-info").textContent = `${f.name} : ${Math.round(trace.km)} km, ${Math.round(trace.dplus)} m D+ (départ de la trace utilisé pour la météo)`;
  } catch (err) { trace = null; $("#p-gpx-info").innerHTML = `<span class="erreur">${esc(err.message)}</span>`; }
};
$("#p-texte").onkeydown = e => { if (e.key === "Enter") $("#p-go").click(); };
$("#p-go").onclick = async () => {
  const texte = $("#p-texte").value.trim(), ville = $("#p-ville").value.trim(), msg = $("#p-message");
  if (!texte) { msg.innerHTML = `<p class="erreur">Décris ta sortie, par exemple « Gravel samedi toute la journée ».</p>`; return; }
  const lieuTexte = lieuDuTexte(norm(texte));
  if (!trace && !ville && !lieuTexte) { msg.innerHTML = `<p class="erreur">Indique un lieu (« à Tours »), une ville de départ ou une trace GPX pour la météo.</p>`; return; }
  if (ville) stocker.ecrire("ville", ville);
  msg.innerHTML = `<p class="vide">Récupération de la météo…</p>`;
  try {
    const p = analyserTexte(texte);
    // Priorité : trace GPX, puis lieu écrit dans la phrase, puis ville par défaut du champ.
    const lieu = trace ? { lat: trace.lat, lon: trace.lon, nom: trace.nom || "départ de la trace" } : await geocoder(lieuTexte || ville);
    const w = await meteo(lieu, p.date, p.jours, p.debut, p.fin);
    let tmin = w.tminRessentie;
    // Au-dessus du point de prévision, on retire 0,65 °C par 100 m de montée.
    if (trace?.altMax != null && trace.altMax > w.altitudeMeteo + 100) {
      const baisse = (trace.altMax - w.altitudeMeteo) * 0.0065;
      tmin -= baisse;
      p.hypotheses.push(`ressenti abaissé de ${baisse.toFixed(1)} °C pour le point haut à ${Math.round(trace.altMax)} m`);
    }
    const fmtD = d => d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    const finSortie = new Date(p.date); finSortie.setDate(finSortie.getDate() + p.jours - 1);
    const dateTxt = p.jours > 1 ? `du ${fmtD(p.date)} au ${fmtD(finSortie)} (${p.jours} jours${p.hebergement ? `, ${p.hebergement}` : ""})` : fmtD(p.date);
    const s = { ...w, tmin, activite: p.activite.activite, date: isoLocal(p.date), jours: p.jours, hebergement: p.hebergement, debut: p.debut, fin: p.fin,
      hypotheses: p.hypotheses, trace: trace && { km: trace.km, dplus: trace.dplus, altMax: trace.altMax },
      titre: `${p.activite.activite[0].toUpperCase()}${p.activite.activite.slice(1)} · ${dateTxt} · ${fmtH(p.debut)} – ${fmtH(p.fin)} · ${lieu.nom}` };
    const { r, raisons } = choisirReglages(p.activite, s);
    s.raisons = raisons;
    s.resume = `${Math.round(tmin)} à ${Math.round(w.tmax)} °C ressentis, pluie ${w.pluieProba} %, vent ${Math.round(w.vent)} km/h (rafales ${Math.round(w.rafales)})`;
    sortie = s; stocker.ecrire("sortie", s);
    reglages[s.activite] = r; stocker.ecrire("reglages", reglages);
    cochees[s.activite] = []; stocker.ecrire("cochees", cochees);
    $("#c-activite").value = D.activites.indexOf(p.activite);
    msg.innerHTML = "";
    rendreChecklist(); rendreManques(); rendreInventaire();
    document.querySelector('nav button[data-onglet="checklist"]').click();
    scrollTo(0, 0);
  } catch (err) {
    msg.innerHTML = `<p class="erreur">${esc(err.message)}. Tu peux toujours régler chaud / froid à la main dans l'onglet Checklist.</p>`;
  }
};
</script>
